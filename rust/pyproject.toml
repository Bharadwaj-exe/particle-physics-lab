[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "particlelab_fast"
version = "0.1.0"
description = "Optional compiled kernels for particlelab: hit simulation and track fitting"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
license = { text = "MIT" }

[tool.maturin]
features = ["pyo3/extension-module"]
