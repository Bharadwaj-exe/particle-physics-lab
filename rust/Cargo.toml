[package]
name = "particlelab_fast"
version = "0.1.0"
edition = "2021"
description = "Optional compiled kernels for particlelab: hit simulation and track fitting"
license = "MIT"
publish = false

[lib]
name = "particlelab_fast"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "generate-import-lib"] }
numpy = "0.22"
rayon = "1.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
